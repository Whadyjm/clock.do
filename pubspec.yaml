name: clockdo
description: "Clock.Do — Radial Time-Blocking ToDo App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  google_fonts: ^6.2.1
  intl: ^0.20.2
  uuid: ^4.5.1
  shared_preferences: ^2.3.3
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4
  flutter_timezone: ^3.0.1
  supabase_flutter: ^2.8.0
  device_calendar: ^4.3.3


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - assets/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/clockdoicon.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/clockdoicon.png"
    background_color: "#ffffff"
    theme_color: "#6C5CE7"
